# Render blueprint — describes the deployed services for Lexicon.
# When you connect this repo to Render and "Apply Blueprint", it provisions
# both services in one go.
#
# Note on storage: Render's free tier doesn't include persistent disks, so
# Chroma writes to the container's local filesystem. The index will reset on
# service restart or after the free-tier instance sleeps. For demo purposes
# this is fine — re-upload your documents at the start of the session.
# To get true persistence, upgrade lexicon-backend to a paid tier and add a
# `disk:` block mounting at the same path.

services:
  - type: web
    name: lexicon-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false              # set this in the Render dashboard
      - key: FLASK_ENV
        value: production
      - key: CHROMA_PERSIST_DIR
        value: /tmp/chroma       # ephemeral on free tier; see header note
      - key: CORS_ORIGINS
        sync: false              # set to the deployed frontend URL

  - type: web
    name: lexicon-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false              # set to the deployed backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        
