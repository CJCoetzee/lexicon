# Render blueprint — describes the deployed services for Lexicon.
# When you connect this repo to Render and "Apply Blueprint", it provisions
# both services in one go.

services:
  - type: web
    name: lexicon-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false              # set this in the Render dashboard
      - key: FLASK_ENV
        value: production
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma
      - key: CORS_ORIGINS
        sync: false              # set to the deployed frontend URL
    disk:
      name: chroma-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: lexicon-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false              # set to the deployed backend URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
